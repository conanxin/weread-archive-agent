name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests with synthetic EPUB fixtures
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: python wereadlab.py status --json